name: A2A Benchmark Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  a2a-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Generate A2A baseline
        run: npm run benchmark:a2a:baseline

      - name: Enforce strict A2A gate
        run: npm run benchmark:a2a:gate

      - name: Upload A2A reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2a-benchmark-reports
          path: reports/*.json
